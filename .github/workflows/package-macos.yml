name: Build & Package macOS (Apple Silicon ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon ARM64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Homebrew Downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-qt5-root-libssh2

      - name: Install Homebrew dependencies (Qt5, CERN ROOT, libssh2)
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install qt@5 root libssh2

      - name: Build Standalone NuTrackN DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh packaging/macos/nutrackn_launcher packaging/macos/generate_icns.py
          ./packaging/macos/build_dmg.sh

      - name: Verify Packaged macOS Bundle & DMG
        run: |
          ls -lh dist/
          ./packaging/macos/build/NuTrackN.app/Contents/MacOS/nutrackn --help

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuTrackN-macOS-arm64
          path: dist/NuTrackN-macOS-*.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NuTrackN-macOS-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
