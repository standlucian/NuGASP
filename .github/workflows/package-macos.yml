name: Build & Package macOS (Apple Silicon ARM64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon ARM64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies (Qt5 & CERN ROOT)
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install qt@5 root

      - name: Build Standalone NuTrackN DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh packaging/macos/nutrackn_launcher packaging/macos/generate_icns.py
          ./packaging/macos/build_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuTrackN-macOS-arm64
          path: dist/NuTrackN-macOS-*.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NuTrackN-macOS-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
